# Install as /etc/X11/xorg.conf.d/10-aksarator-kiosk.conf.
# Applies to every X session on the machine, not only the kiosk session.
Section "ServerFlags"
    # Ctrl+Alt+F1..F12 do not switch to a text console.
    Option "DontVTSwitch" "true"
    # Ctrl+Alt+Backspace does not kill the X server.
    Option "DontZap" "true"
EndSection
