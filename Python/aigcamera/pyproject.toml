[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "aigcamera"
version = "0.1.0"
description = "Unified Python interface for AIGCamera hardware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.1",
    "pillow>=12.1.0",
]

# These `.so` and the housing directory may not be visible
# from remote repository like GitHub and it's intentional.
# These `.so` will be distributed to developers manually
# due to the proprietary nature of the shared object.
[tool.hatch.build.targets.wheel]
packages = ["src/aigcamera"]
include = ["src/aigcamera/_native/*.so"]
force-include = { "src/aigcamera/_native/AimPosition312.so" = "aigcamera/_native/AimPosition312.so" }

[tool.hatch.build.targets.sdist]
include = ["src/aigcamera/_native/*.so"]

[tool.ruff]
exclude = ["ll_aim_api"]

[tool.ty.environment]
root = ["./src"]
